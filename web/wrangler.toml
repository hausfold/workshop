# Cloudflare Worker for nebelhaus.com. It serves one thing now: permanent
# redirects to hausfold.co, which holds every page this zone used to.
#
#   /guides/pounce   → https://hausfold.co/docs/haus/rooms/launcher/
#   /init.sh         → https://hausfold.co/nebelhaus.sh
#   anything else    → 404
#
# ⚠️ `/init.sh` did not reach this Worker until 2026-08-14. The installer's first
# deployment was its own script, `nebelhaus-init`, on the more specific route
# `nebelhaus.com/init.sh*` (this file at 8ceca10) — and a route belongs to the
# script that declared it, so no deploy under a different name reclaims it. It
# took `npx wrangler delete --name nebelhaus-init` on the account; the routes
# went with the script. Rename plan §5.3 has the measurements. **This config
# describes the deployment it wants, not the one that exists** — the dashboard's
# Workers ▸ Routes is the only place that answer lives.
#
# The map is worker.js. There is no build and no [assets] binding — the Astro
# site this Worker used to front is deleted (rename plan §5.2), which is what
# ends the two-copies-of-every-docs-page problem.
#
# Deploy (the nebelhaus.com zone must be on the logged-in CF account):
#   cd web && npx wrangler deploy    # (nixpkgs' wrangler fails to build — use npx)
#
# ⚠️ The Worker keeps its name. Renaming it uploads a NEW script and leaves the
# old one holding the zone route until something takes it away.
name = "nebelhaus"
main = "worker.js"
compatibility_date = "2024-11-06"

# The whole apex zone routes through this Worker. Nothing short-circuits it any
# more: the [assets] binding that used to serve the static build — and that
# 307'd `/guides/pounce` onto `/guides/pounce/` on the way — is gone, so
# worker.js answers every path itself, both spellings included.
routes = [
  { pattern = "nebelhaus.com/*", zone_name = "nebelhaus.com" },
]
