# PR-only Worker config. The workflow overrides `name` with
# nebelhaus-pr-<number>; no custom route is present, so this can never replace
# the Worker serving nebelhaus.com.
#
# That property is enforced, not just documented — preview-web.yml's "Refuse a
# preview config that defines routes" step fails the job if a route appears
# here, in any TOML spelling. This file is read from the PR head, so a comment
# alone would protect nothing.
#
# ⚠️ Keep this in step with wrangler.toml's `main` and compatibility_date. It is
# the copy a PR is actually *felt* on, so a key in one config and not the other
# is invisible in the worst way — the change looks fine on the preview URL
# precisely because the thing it changed isn't running there. hausfold.co learned
# this with its own `main`; here there is no [assets] binding on either side, and
# that sameness is the point.
name = "nebelhaus-preview"
main = "worker.js"
compatibility_date = "2024-11-06"
workers_dev = true
