# Verify the workshop's code artifacts on every push and PR:
#   • bench — the family CLI (bats unit suite + shellcheck)
#
# This is the gate the repo was missing: nothing checked behavior before.
#
# `lib/ui.sh` was here too until 2026-08-27 and is now hausfold/snug's
# `share/ui.sh`, tested by snug's own `bash` job. It moved because `haus.sh` is
# read into a store binary and a haus user has no workshop checkout, so the
# caller that most needed the fallback could never have sourced it from here.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  bench:
    name: bench (bats + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: shellcheck
        run: shellcheck bench
      - name: bats
        run: bats test/bench.bats
