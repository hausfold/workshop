# Verify the workshop's code artifacts on every push and PR:
#   • bench — the family CLI (bats unit suite + shellcheck)
#
# This is the gate the repo was missing: nothing checked behavior before.
#
# `bench` is the only thing here with behavior to check. Two other bodies of
# shell were in this job and now live in the repos that ship them, for the same
# reason each time — the caller that most needs a thing cannot reach it from a
# workshop checkout:
#
#   • `lib/ui.sh` is hausfold/snug's `share/ui.sh`, tested by snug's own `bash`
#     job. `haus.sh` is read into a store binary and a haus user has no workshop
#     checkout, so the caller that most needed the fallback could never have
#     sourced it from here.
#   • `script/factory-*` is hausfold/factory, whose CI runs the same 87 bats
#     cases plus shellcheck. The night shift is a thing a machine RUNS, not a
#     thing this directory contains: haus puts `factory` on PATH, so the tool
#     has to be testable and installable without this repo. `docs/factory.md`
#     is now the policy it runs under here, and nothing in it is executable.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  bench:
    name: bench (bats + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      # The versions are printed because they are not pinned, and apt's
      # shellcheck disagrees with a newer one about which checks are on by
      # default: SC2015 on `A && B || C` fires here and not under 0.11.0, so
      # "clean locally" is not the same claim as "clean in this job". When
      # this step reddens on a line nobody touched, the version is the first
      # thing to read.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck bench
      - name: bats
        run: |
          bats --version
          bats test/bench.bats
          bats test/design-palette.bats
