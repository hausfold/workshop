# Verify the workshop's code artifacts on every push and PR:
#   • bench — the family CLI (bats unit suite + shellcheck)
#
# This is the gate the repo was missing: nothing checked behavior before.
#
# `bench` is the only thing here with behavior to check. Two other bodies of
# shell were in this job and now live in the repos that ship them, for the same
# reason each time — the caller that most needs a thing cannot reach it from a
# workshop checkout:
#
#   • `lib/ui.sh` is hausfold/snug's `share/ui.sh`, tested by snug's own `bash`
#     job. `haus.sh` is read into a store binary and a haus user has no workshop
#     checkout, so the caller that most needed the fallback could never have
#     sourced it from here.
#   • `script/factory-*` is hausfold/factory, whose CI runs that suite plus
#     shellcheck. The night shift is a thing a machine RUNS, not a
#     thing this directory contains: haus puts `factory` on PATH, so the tool
#     has to be testable and installable without this repo. Nothing about the
#     night shift is left here to test — the manual is factory's own README and
#     the layer's levers are the site's `docs/haus/night-shift` plus haus's
#     `docs/night-shift-internals.md`.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — a runner the next PR then waits
# behind.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: bench (bats + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bats is the one tool of the two the ubuntu-latest image lacks, and npm
      # is preinstalled, so it comes from npm rather than apt. shellcheck is
      # already on the image; `apt-get update` in front of it bought nothing
      # and, on the day the Azure mirrors go quiet, hangs rather than fails —
      # haus/check.yml has the long version of that afternoon.
      - name: Install bats
        run: sudo npm install -g bats
      # The versions are printed because they are not pinned, and one shellcheck
      # disagrees with another about which checks are on by default: SC2015 on
      # `A && B || C` fires under the 0.9.0 that ubuntu-24.04 carries and not
      # under the 0.11.0 that 26.04 does, so "clean locally" is not the same
      # claim as "clean in this job" — and the version moves when the image
      # does, not when anyone edits this file. When this step reddens on a line
      # nobody touched, the version is the first thing to read.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck bench
      - name: bats
        run: |
          bats --version
          bats test/bench.bats
          bats test/design-palette.bats
