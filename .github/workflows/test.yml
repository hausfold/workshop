# Verify the workshop's code artifacts on every push and PR:
#   • bench             — the family CLI (bats unit suite + shellcheck)
#   • script/factory-*  — the night shift (bats unit suite + shellcheck)
#
# This is the gate the repo was missing: nothing checked behavior before.
#
# The factory scripts are here because what goes wrong with them is not a
# crash. `factory-shift` runs unattended and its product is a log read hours
# later, so its worst output is a pass that could not see and said nothing,
# which reads exactly like a quiet night. `test/factory-shift.bats` stubs
# `gh`, `trill` and `factory-tier` so those passes are observable.
#
# `lib/ui.sh` was here too until 2026-08-27 and is now hausfold/snug's
# `share/ui.sh`, tested by snug's own `bash` job. It moved because `haus.sh` is
# read into a store binary and a haus user has no workshop checkout, so the
# caller that most needed the fallback could never have sourced it from here.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  bench:
    name: bench + factory (bats + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: shellcheck
        run: shellcheck bench script/factory-lease script/factory-shift script/factory-tier
      - name: bats
        run: bats test/bench.bats test/factory-shift.bats
